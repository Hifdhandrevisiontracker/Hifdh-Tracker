<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Hifdh Tracker</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f5f4a"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1b2420;--mu:#6b7a72;--ac:#1f5f4a;--ac2:#d9ece3;--bd:#e1e6e3;--wr:#c9a227}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--tx:#e8eeea;--mu:#93a39a;--ac:#4cbf93;--ac2:#25382f;--bd:#2c3a33}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.task{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer}
.task.done{background:var(--ac2)}.task input{width:24px;height:24px;accent-color:var(--ac);flex:none}
.task b{display:block}.tag{font-size:11px;color:var(--ac);font-weight:700;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.j{aspect-ratio:1;border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);position:relative;overflow:hidden}
.j span{position:relative;z-index:1}.j i{position:absolute;left:0;bottom:0;width:100%;background:var(--ac);opacity:.55}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.s{aspect-ratio:1;border-radius:4px;background:var(--bd)}
.s1{background:var(--wr)}.s2{background:var(--ac)}
.cyc{display:flex;gap:6px;flex-wrap:wrap}.cy{padding:5px 10px;border-radius:20px;border:1px solid var(--bd);font-size:12px}.cy.on{background:var(--ac);color:#fff;border-color:var(--ac)}
label.f{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input[type=number],input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
button{padding:10px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:14px;font-weight:600;margin-top:10px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.d{background:#b3382c}
#msg{color:#b3382c;font-size:13px;min-height:18px}details summary{cursor:pointer;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--mu);margin:3px 0 0;line-height:1.35}.help ol{padding-left:20px;margin:10px 0 0}.help li{margin-bottom:10px;font-size:14px;line-height:1.45}.help b{color:var(--ac)}</style></head><body>
<h1>📖 Hifdh Tracker</h1>
<div id="msg"></div>
<div id="app" class="mu">Loading…</div>
<script>
const JUZ_START=[0,1,22,42,62,82,102,122,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const TOTAL=604;
const DEFAULTS={frontier:0,newPerDay:1,revPerDay:1,chunks:[5,10,15,0],cycle:0,juz:1,period:1};
const pad=n=>String(n).padStart(2,'0');
const T=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let D=null;
const $=id=>document.getElementById(id);
const LS=window.localStorage;
function ld(k,d){try{const v=LS.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{LS.setItem(k,JSON.stringify(v))}catch(e){$('msg').textContent='Could not save: '+e.message}}
const juzEnd=j=>j===30?TOTAL:JUZ_START[j+1]-1;
function juzOf(p){for(let j=30;j>=1;j--)if(p>=JUZ_START[j])return j;return 1}
const loadState=()=>Object.assign({},DEFAULTS,ld('hifdh_state',{}));
const saveState=s=>sv('hifdh_state',s);
const loadDays=()=>ld('hifdh_days',{});
function addDays(str,k){const p=str.split('-');const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+k);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const anyDone=day=>(day.n&&day.n.done)||day.r.some(t=>t.done);
function allDone(day){const t=(day.n?1:0)+day.r.length;if(!t)return false;return(!day.n||day.n.done)&&day.r.every(x=>x.done)}
function makePlan(s){
  const plan={n:null,r:[],u:[]};
  if(s.newPerDay>0&&s.frontier<TOTAL)plan.n={a:s.frontier+1,b:Math.min(TOTAL,s.frontier+s.newPerDay),done:false};
  let pos={c:s.cycle,j:s.juz,p:s.period};
  for(let i=0;i<s.revPerDay&&s.frontier>=1;i++){
    const top=juzOf(s.frontier);
    if(pos.j>top){pos.j=1;pos.c++;if(pos.c>=s.chunks.length){pos.c=0;pos.p++}}
    const end=Math.min(juzEnd(pos.j),s.frontier),st=JUZ_START[pos.j],N=s.chunks[pos.c];
    const from=N>0?Math.max(st,end-N+1):st;
    const before={c:pos.c,j:pos.j,p:pos.p},after={c:pos.c,j:pos.j+1,p:pos.p};
    plan.r.push({j:pos.j,a:from,b:end,c:pos.c,p:pos.p,n:N,done:false,before,after});
    pos={c:after.c,j:after.j,p:after.p};
  }
  return plan;
}
const api={
  getData(today){
    const s=loadState(),days=loadDays();
    let day=days[today];
    if(!day||!anyDone(day)){day=makePlan(s);days[today]=day}
    const cutoff=addDays(today,-400);
    Object.keys(days).forEach(k=>{if(k<cutoff)delete days[k]});
    sv('hifdh_days',days);
    const strip=[];
    for(let i=27;i>=0;i--){const d=addDays(today,-i);const o=days[d];strip.push({d,s:o?(allDone(o)?2:(anyDone(o)?1:0)):0})}
    let streak=0;for(let k=strip[27].s===2?27:26;k>=0&&strip[k].s===2;k--)streak++;
    const juz=[];
    for(let j=1;j<=30;j++){const len=juzEnd(j)-JUZ_START[j]+1;juz.push(Math.max(0,Math.min(len,s.frontier-JUZ_START[j]+1))/len)}
    const remaining=TOTAL-s.frontier;
    const eta=(s.newPerDay>0&&remaining>0)?addDays(today,Math.ceil(remaining/s.newPerDay)-1):null;
    return{state:s,day,stats:{juz,strip,streak,remaining,eta}};
  },
  tick(today,key){
    const s=loadState(),days=loadDays(),day=days[today];
    const task=key==='n'?day.n:day.r[+key.slice(1)];
    if(!task)return{error:'Task not found.'};
    if(!task.done){
      if(key==='n'){task.prev=s.frontier;s.frontier=Math.max(s.frontier,task.b)}
      else{s.cycle=task.after.c;s.juz=task.after.j;s.period=task.after.p}
      task.done=true;day.u.push(key);
    }else{
      if(day.u[day.u.length-1]!==key)return{error:'Undo the most recent tick first.'};
      if(key==='n')s.frontier=task.prev;
      else{s.cycle=task.before.c;s.juz=task.before.j;s.period=task.before.p}
      task.done=false;day.u.pop();
    }
    saveState(s);sv('hifdh_days',days);
    return api.getData(today);
  },
  saveSettings(today,f){
    const s=loadState();
    const chunks=String(f.chunks).split(',').map(x=>parseInt(x,10)).filter(x=>!isNaN(x)&&x>=0&&x<=21);
    if(!chunks.length)return{error:'Cycle sizes must look like 5,10,15,0 (0 = whole juz).'};
    s.chunks=chunks.slice(0,8);
    s.frontier=Math.max(0,Math.min(TOTAL,parseInt(f.frontier,10)||0));
    s.newPerDay=Math.max(0,Math.min(20,parseInt(f.newPerDay,10)||0));
    s.revPerDay=Math.max(0,Math.min(5,parseInt(f.revPerDay,10)||0));
    s.cycle=Math.max(0,Math.min(s.chunks.length-1,(parseInt(f.cycle,10)||1)-1));
    s.juz=Math.max(1,Math.min(30,parseInt(f.juz,10)||1));
    s.period=Math.max(1,parseInt(f.period,10)||1);
    saveState(s);dropIfUnticked(today);
    return api.getData(today);
  },
  addPages(today,n){
    const s=loadState();
    s.frontier=Math.min(TOTAL,s.frontier+Math.max(0,parseInt(n,10)||0));
    saveState(s);dropIfUnticked(today);
    return api.getData(today);
  }
};
function dropIfUnticked(today){const d=loadDays();if(d[today]&&!anyDone(d[today])){delete d[today];sv('hifdh_days',d)}}
function call(fn,...a){
  $('msg').textContent='';
  try{const r=api[fn](T(),...a);if(r&&r.error){$('msg').textContent=r.error;return}if(r)D=r}
  catch(e){$('msg').textContent=e.message;return}
  render();
}
function resetAll(){LS.removeItem('hifdh_state');LS.removeItem('hifdh_days');D=null;render()}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'hifdh',v:1,state:loadState(),days:loadDays()})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hifdh-backup-'+T()+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);
    if(o.app!=='hifdh'||!o.state||!o.days)throw new Error('This is not a Hifdh backup file.');
    if(!confirm('Replace your current data with this backup?'))return;
    saveState(Object.assign({},DEFAULTS,o.state));sv('hifdh_days',o.days);D=null;render();
  }catch(e){$('msg').textContent=e.message}};
  r.readAsText(f);inp.value='';
}
const rng=(a,b)=>a===b?`Page ${a}`:`Pages ${a}–${b}`;
const chunkName=n=>n>0?`last ${n} pages`:'whole juz';
function fmt(d){return d?new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—'}
function render(){
  if(!D){call('getData');return}
  const s=D.state,st=D.stats,day=D.day,pct=Math.round(s.frontier/604*100);
  let h=`<div class="card"><div class="row"><b>${s.frontier} / 604 pages</b><span class="mu">${pct}%</span></div>
  <div class="bar" style="margin:8px 0"><i style="width:${s.frontier/6.04}%"></i></div>
  <div class="row mu"><span>🔥 Streak: ${st.streak} day${st.streak==1?'':'s'}</span><span>Finish: ${fmt(st.eta)}</span></div></div>`;
  h+=`<div class="card help"><details><summary>❓ How this works (start here)</summary><ol>
  <li><b>Set up once.</b> Open ⚙️ Settings at the bottom. Type the last page you have memorized in <i>Last page memorized</i> and make <i>Cycle sizes</i> say <i>5,10,15,0</i>. Tap <i>Save settings</i>.</li>
  <li><b>Every day, open “Today”.</b> You will see a <i>New hifdh</i> task (the page to memorize) and a <i>Revision</i> task (a juz and the pages to revise).</li>
  <li><b>Tick each task when you finish it.</b> Tap the task box. Ticking new hifdh moves your progress forward, so tomorrow you get the next page. Ticking revision moves to the next juz.</li>
  <li><b>The revision cycle.</b> Each day you revise the last pages of one juz: Juz 1, then Juz 2, and so on up to where you are. Cycle 1 uses the last 5 pages of each juz, cycle 2 the last 10, cycle 3 the last 15, and cycle 4 the whole juz. After cycle 4, a new period starts again at 5 pages.</li>
  <li><b>New juz is added automatically.</b> As you memorize into a new juz, it joins your revision.</li>
  <li><b>Made a mistake?</b> Tap <i>Undo last tick</i>.</li>
  <li><b>Missed a day?</b> Nothing breaks. Just carry on the next day.</li>
  <li><b>Changing your plan?</b> In Settings, change <i>New pages / day</i> (for example 2) and tap <i>Save settings</i>. Today’s plan updates if you haven’t ticked anything yet.</li>
  <li><b>Reading your progress.</b> The green bar shows pages memorized out of 604. The 30 boxes show each juz filling up. The small squares show the last 28 days: green = everything done, yellow = some done, grey = nothing.</li>
  <li><b>Back up your progress.</b> Your data is saved on this phone only. Now and then, open Settings and tap <i>Export backup</i> and keep the file safe. Use <i>Import backup</i> to restore it on a new phone.</li>
  </ol></details></div>`;
  h+=`<div class="card"><h2>Today</h2>`;
  if(day.n){h+=`<div class="task ${day.n.done?'done':''}" onclick="call('tick','n')"><input type="checkbox" ${day.n.done?'checked':''} onclick="event.preventDefault()"><div><span class="tag">New hifdh</span><b>${rng(day.n.a,day.n.b)}</b></div></div>`}
  day.r.forEach((t,i)=>{h+=`<div class="task ${t.done?'done':''}" onclick="call('tick','r${i}')"><input type="checkbox" ${t.done?'checked':''} onclick="event.preventDefault()"><div><span class="tag">Revision</span><b>Juz ${t.j} · ${rng(t.a,t.b)}</b><span class="mu">${chunkName(t.n)} · period ${t.p}, cycle ${t.c+1}/${s.chunks.length}</span></div></div>`});
  if(!day.n&&!day.r.length)h+=`<div class="mu">Nothing planned. Set pages in Settings.</div>`;
  else if(day.u.length)h+=`<div class="mu">${day.u.length==((day.n?1:0)+day.r.length)?'✅ All done today, māshā’Allāh!':''}</div><button class="g" onclick="call('tick','${day.u[day.u.length-1]}')">Undo last tick</button>`;
  h+=`</div><div class="card"><h2>Revision cycle (period ${s.period})</h2><div class="cyc">`+
   s.chunks.map((n,i)=>`<span class="cy ${i==s.cycle?'on':''}">${i+1}. ${chunkName(n)}</span>`).join('')+
   `</div><div class="mu" style="margin-top:8px">Next up: Juz ${s.juz>Math.ceil(0)&&s.juz<=30?s.juz:1} in cycle ${s.cycle+1}</div></div>`;
  h+=`<div class="card"><h2>Juz progress</h2><div class="grid">`+st.juz.map((f,i)=>`<div class="j"><i style="height:${f*100}%"></i><span>${i+1}</span></div>`).join('')+`</div></div>`;
  h+=`<div class="card"><h2>Last 28 days</h2><div class="strip">`+st.strip.map(x=>`<div class="s s${x.s}" title="${x.d}"></div>`).join('')+`</div></div>`;
  h+=`<div class="card"><details><summary>⚙️ Settings</summary>
  <div class="two"><div><label class="f">Last page memorized</label><input type="number" id="fr" value="${s.frontier}"><div class="hint">The last page you know by heart. Tomorrow’s new page is this +1.</div></div>
  <div><label class="f">New pages / day</label><input type="number" id="np" value="${s.newPerDay}"><div class="hint">How many new pages you memorize daily. 0 = revision only.</div></div>
  <div><label class="f">Juz revised / day</label><input type="number" id="rp" value="${s.revPerDay}"><div class="hint">How many juz you revise each day. Normally 1.</div></div>
  <div><label class="f">Period #</label><input type="number" id="pe" value="${s.period}"><div class="hint">Which round of the 4 cycles you are on. It goes up by itself.</div></div>
  <div><label class="f">Current cycle #</label><input type="number" id="cy" value="${s.cycle+1}"><div class="hint">1 = last 5 pages, 2 = last 10, 3 = last 15, 4 = whole juz.</div></div>
  <div><label class="f">Next juz in cycle</label><input type="number" id="ju" value="${s.juz}"><div class="hint">The juz you will revise next (1–30). Use this to move your place.</div></div></div>
  <label class="f">Cycle sizes (pages from end of each juz, 0 = whole juz)</label><input type="text" id="ch" value="${s.chunks.join(',')}"><div class="hint">One number per cycle, separated by commas. <b>5,10,15,0</b> = last 5, last 10, last 15, then whole juz (0 = whole juz).</div>
  <button onclick="save()">Save settings</button>
  <label class="f" style="margin-top:16px">Add extra pages I memorized</label><div class="hint">Memorized more than planned? Type how many pages and tap Add.</div>
  <div class="row"><input type="number" id="ad" value="1" style="width:90px"><button onclick="call('addPages',$('ad').value)" style="margin:0">Add</button></div>
  <label class="f" style="margin-top:16px">Backup</label><div class="hint">Your data lives only on this phone. Export a backup file now and then.</div><div class="row" style="justify-content:flex-start"><button onclick="exportData()">Export backup</button><button class="g" onclick="$('imp').click()">Import backup</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">
  <button class="d" style="margin-top:20px" onclick="if(confirm('Delete ALL your data?')){resetAll()}">Reset everything</button>
  </details></div>`;
  $('app').innerHTML=h;
}
function save(){call('saveSettings',{frontier:$('fr').value,newPerDay:$('np').value,revPerDay:$('rp').value,period:$('pe').value,cycle:$('cy').value,juz:$('ju').value,chunks:$('ch').value})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){D=null;render()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
