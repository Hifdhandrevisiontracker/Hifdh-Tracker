<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f4a" id="metaTheme">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root{
  --bg:#f5f7f6;--card:#ffffff;--tx:#16201c;--mu:#63736b;--bd:#e3e9e6;--wr:#d99b16;
  --ac:#1f5f4a;--ac2:#e3f1eb;--sh:0 4px 16px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0d1311;--card:#161f1c;--tx:#ebf1ee;--mu:#8b9d94;--bd:#24332d;
  --sh:0 4px 20px rgba(0,0,0,.3);
}
[data-color="emerald"]{--ac:#1f5f4a;--ac2:#e3f1eb}
[data-theme="dark"][data-color="emerald"]{--ac:#4cbf93;--ac2:#1b3229}
[data-color="blue"]{--ac:#2563eb;--ac2:#e0ecff}
[data-theme="dark"][data-color="blue"]{--ac:#60a5fa;--ac2:#1a2942}
[data-color="gold"]{--ac:#a16207;--ac2:#fef3c7}
[data-theme="dark"][data-color="gold"]{--ac:#fbbf24;--ac2:#352912}
[data-color="plum"]{--ac:#7c3aed;--ac2:#ede9fe}
[data-theme="dark"][data-color="plum"]{--ac:#a78bfa;--ac2:#281d40}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:14px 14px 88px;max-width:560px;margin:auto;transition:background .25s,color .25s}
h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.3px}
h2{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:12px;color:var(--mu);margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:var(--sh)}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s ease}
.mu{color:var(--mu);font-size:12.5px;line-height:1.45}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Header & Avatar */
.hdr{margin-bottom:14px}
.avatar-btn{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);padding:4px 10px 4px 4px;border-radius:99px;cursor:pointer;color:var(--tx);box-shadow:var(--sh);margin:0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-lg{width:62px;height:62px;font-size:21px}

/* Buttons & Inputs */
label.f{display:block;font-size:11.5px;color:var(--mu);margin:10px 0 4px;font-weight:600}
input[type=number],input[type=text],input[type=email],select,textarea{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13.5px;font-family:inherit;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
button{padding:10px 14px;border-radius:11px;border:0;background:var(--ac);color:#fff;font-size:13.5px;font-weight:600;margin-top:8px;cursor:pointer;transition:opacity .15s,transform .1s}
button:active{transform:scale(.98)}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.d{background:#b91c1c;color:#fff}
button.sm{padding:6px 11px;font-size:12px;margin-top:0;border-radius:9px}
.pill{display:inline-block;font-size:10.5px;padding:3px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:700}
.cyc{display:flex;gap:6px;flex-wrap:wrap}
.cy{padding:6px 13px;border-radius:99px;border:1px solid var(--bd);font-size:12px;cursor:pointer;background:var(--bg);color:var(--mu);font-weight:600}
.cy.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{color:#b91c1c;font-size:12.5px;min-height:16px;margin-bottom:4px;font-weight:600}

/* Visual Card Selectors for Onboarding & Settings */
.choice-card{border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--card);transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.choice-card.on{border-color:var(--ac);background:var(--ac2);box-shadow:0 2px 12px rgba(31,95,74,.1)}
.choice-card b{font-size:13.5px;display:block}
.choice-card span{font-size:11.5px;color:var(--mu)}

/* 3-Slide Onboarding Carousel */
.ob-wrap{text-align:center;padding:12px 6px}
.ob-art{width:116px;height:116px;border-radius:30px;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:52px;margin:10px auto 16px;box-shadow:0 10px 28px rgba(0,0,0,.06);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0}
.dot{width:8px;height:8px;border-radius:99px;background:var(--bd);transition:all .25s}
.dot.on{width:24px;background:var(--ac)}

/* Tasks & Compact Tikrar Habit Pills */
.task-wrap{border:1px solid var(--bd);border-radius:14px;margin-bottom:9px;overflow:hidden;background:var(--card);transition:all .15s}
.task-wrap.done{background:var(--ac2);border-color:var(--ac)}
.task{display:flex;gap:12px;align-items:center;padding:13px;cursor:pointer}
.task input{width:20px;height:20px;accent-color:var(--ac);flex:none}
.task b{display:block;font-size:14px;margin:2px 0}
.tag{font-size:10px;color:var(--ac);font-weight:750;text-transform:uppercase;letter-spacing:.5px}
.tikrar-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tpill{font-size:10.5px;padding:3px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--mu);cursor:pointer;font-weight:600}
.tpill.done{background:var(--ac);color:#fff;border-color:var(--ac)}

/* Winding Landscape Journey Map */
.winding-map{position:relative;padding:24px 10px 30px;border-radius:18px;background:linear-gradient(180deg, #f4eee1 0%, var(--bg) 60%);border:1px solid var(--bd);overflow:hidden}
.summit-crown{text-align:center;margin-bottom:18px}
.summit-badge{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle, #fff 10%, #fbbf24 55%, #d97706 100%);box-shadow:0 0 25px rgba(251,191,36,.7);display:flex;align-items:center;justify-content:center;font-size:24px;animation:pulseGlow 2.4s infinite alternate}
@keyframes pulseGlow{from{transform:scale(.96)}to{transform:scale(1.06)}}
.path-container{display:flex;flex-direction:column;gap:16px;align-items:center;position:relative}
.path-node{width:100%;max-width:340px;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:16px;background:var(--card);border:1.5px solid var(--bd);box-shadow:var(--sh);transition:transform .2s}
.path-node.climbed{background:var(--ac2);border-color:transparent;opacity:.88}
.path-node.current{border:2px solid var(--ac);box-shadow:0 6px 20px rgba(31,95,74,.2);transform:scale(1.03);background:var(--card)}
.node-bubble{width:38px;height:38px;border-radius:50%;background:var(--bd);color:var(--tx);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.path-node.climbed .node-bubble,.path-node.current .node-bubble{background:var(--ac);color:#fff}
.node-info{flex:1}
.node-info b{font-size:13.5px;display:block}
.node-info .mu{font-size:11.5px}

/* Centered Minimalist Tasbih */
.tasbih-stage{min-height:66vh;display:flex;flex-direction:column;justify-content:space-between;padding:18px;border-radius:22px;position:relative;transition:all .3s;border:1px solid var(--bd)}
.t-theme-emerald{background:linear-gradient(160deg,var(--card),var(--ac2));--t-ring:var(--ac)}
.t-theme-midnight{background:linear-gradient(160deg,#0f172a,#1e293b);color:#f8fafc;--t-ring:#38bdf8;border-color:#334155}
.t-theme-sand{background:linear-gradient(160deg,#fdfbf7,#f3ead8);color:#423629;--t-ring:#b45309;border-color:#e6dac3}
.t-theme-gold{background:linear-gradient(160deg,#1c1917,#292524);color:#fef3c7;--t-ring:#fbbf24;border-color:#44403c}
.t-theme-ocean{background:linear-gradient(160deg,#082f49,#0c4a6e);color:#e0f2fe;--t-ring:#38bdf8;border-color:#0369a1}
.tasbih-center{margin:auto;text-align:center}
.tasbih-orb{width:210px;height:210px;border-radius:50%;border:7px solid var(--t-ring,var(--ac));background:rgba(255,255,255,.06);backdrop-filter:blur(4px);color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:16px auto;cursor:pointer;box-shadow:0 12px 34px rgba(0,0,0,.15);transition:transform .08s}
.tasbih-orb:active{transform:scale(.94)}
.tasbih-num{font-size:48px;font-weight:800;line-height:1}
.tasbih-sub{font-size:12px;opacity:.8;margin-top:6px;font-weight:500}
.pop-menu{position:absolute;top:54px;right:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:14px;width:255px;box-shadow:0 12px 32px rgba(0,0,0,.22);z-index:30}

/* Rich Text Editor & Media Vault */
.rt-bar{display:flex;gap:5px;flex-wrap:wrap;padding:7px;background:var(--bg);border:1px solid var(--bd);border-radius:10px 10px 0 0;border-bottom:0}
.rt-bar button,.rt-bar select{margin:0;padding:5px 8px;font-size:12px;border-radius:7px;width:auto}
.rt-area{min-height:130px;padding:12px;border:1px solid var(--bd);border-radius:0 0 10px 10px;background:var(--bg);color:var(--tx);outline:none;line-height:1.55;font-size:14px;overflow-x:auto}
.rt-area table{width:100%;border-collapse:collapse;margin:8px 0}
.rt-area td,.rt-area th{border:1px solid var(--bd);padding:6px 8px;min-width:60px}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.media-box{border:1px solid var(--bd);border-radius:11px;padding:8px;background:var(--bg)}
.media-box img,.media-box video{width:100%;border-radius:8px;max-height:180px;object-fit:cover}
.rec-btn{width:80px;height:80px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;margin:14px auto;box-shadow:0 6px 20px rgba(0,0,0,.15)}

/* Bottom Nav & Modals */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px 10px;z-index:20;max-width:560px;margin:auto}
.nav button{background:none;color:var(--mu);margin:0;padding:4px 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;font-weight:500}
.nav button .ico{font-size:17px;line-height:1.1}
.nav button.active{color:var(--ac);font-weight:750}
.swatches{display:flex;gap:10px;margin-top:6px}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:var(--tx);transform:scale(1.12)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60;backdrop-filter:blur(3px)}
.modal-card{background:var(--card);border:2px solid var(--ac);border-radius:22px;padding:22px 18px;max-width:410px;width:100%;text-align:center;box-shadow:0 14px 36px rgba(0,0,0,.28);animation:pop .22s ease;max-height:88vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.tg-banner{background:linear-gradient(135deg,#0088cc,#005f8f);color:#fff;border-radius:16px;padding:15px;margin-bottom:13px}
.tg-banner a{color:#fff;text-decoration:none;font-weight:700;display:inline-block;background:rgba(255,255,255,.18);padding:7px 12px;border-radius:9px;font-size:12.5px;margin-top:8px;margin-right:6px}
details summary{cursor:pointer;font-weight:700;font-size:14px;outline:none}
</style>
</head>
<body>

<div class="row hdr">
  <div>
    <h1 id="greeting">📖 My Companion</h1>
    <div class="sub" id="subGreeting">Recite & Ascend</div>
  </div>
  <div class="row" style="gap:6px">
    <button class="g sm" onclick="toggleTheme()" id="themeBtn" title="Switch Theme">🌙</button>
    <button class="avatar-btn" id="profileBtn" onclick="setTab('settings')" style="display:none">
      <div class="avatar" id="hdrAvatar">M</div>
      <span style="font-size:12px;font-weight:650">Profile</span>
    </button>
  </div>
</div>

<div id="msg"></div>
<div id="app" class="mu">Loading…</div>
<div id="modalRoot"></div>

<nav class="nav" id="bottomNav" style="display:none">
  <button id="nav-today" class="active" onclick="setTab('today')"><span class="ico">📖</span>Today</button>
  <button id="nav-journey" onclick="setTab('journey')"><span class="ico">🏔️</span>Ascend</button>
  <button id="nav-tasbih" onclick="setTab('tasbih')"><span class="ico">📿</span>Tasbih</button>
  <button id="nav-recite" onclick="setTab('recite')"><span class="ico">🎙️</span>Recite</button>
  <button id="nav-library" onclick="setTab('library')"><span class="ico">📂</span>Library</button>
</nav>

<script>
const JUZ_START=[0,1,22,42,62,82,102,122,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const SURAH_AT_PAGE=[
  [1,"Al-Fatihah"],[2,"Al-Baqarah"],[50,"Ali 'Imran"],[77,"An-Nisa"],[106,"Al-Ma'idah"],[128,"Al-An'am"],
  [151,"Al-A'raf"],[177,"Al-Anfal"],[187,"At-Tawbah"],[208,"Yunus"],[221,"Hud"],[235,"Yusuf"],
  [249,"Ar-Ra'd"],[255,"Ibrahim"],[262,"Al-Hijr"],[267,"An-Nahl"],[282,"Al-Isra"],[293,"Al-Kahf"],
  [305,"Maryam"],[312,"Ta-Ha"],[322,"Al-Anbiya"],[332,"Al-Hajj"],[342,"Al-Mu'minun"],[350,"An-Nur"],
  [359,"Al-Furqan"],[367,"Ash-Shu'ara"],[377,"An-Naml"],[385,"Al-Qasas"],[396,"Al-'Ankabut"],[404,"Ar-Rum"],
  [411,"Luqman"],[415,"As-Sajdah"],[418,"Al-Ahzab"],[428,"Saba"],[434,"Fatir"],[440,"Ya-Sin"],
  [446,"As-Saffat"],[453,"Sad"],[458,"Az-Zumar"],[467,"Ghafir"],[477,"Fussilat"],[483,"Ash-Shura"],
  [489,"Az-Zukhruf"],[496,"Ad-Dukhan"],[499,"Al-Jathiyah"],[502,"Al-Ahqaf"],[507,"Muhammad"],[511,"Al-Fath"],
  [515,"Al-Hujurat"],[518,"Qaf"],[520,"Adh-Dhariyat"],[523,"At-Tur"],[526,"An-Najm"],[528,"Al-Qamar"],
  [531,"Ar-Rahman"],[534,"Al-Waqi'ah"],[537,"Al-Hadid"],[542,"Al-Mujadila"],[545,"Al-Hashr"],[549,"Al-Mumtahanah"],
  [551,"As-Saff"],[553,"Al-Jumu'ah"],[554,"Al-Munafiqun"],[556,"At-Taghabun"],[558,"At-Talaq"],[560,"At-Tahrim"],
  [562,"Al-Mulk"],[564,"Al-Qalam"],[566,"Al-Haqqah"],[568,"Al-Ma'arij"],[570,"Nuh"],[572,"Al-Jinn"],
  [574,"Al-Muzzammil"],[575,"Al-Muddaththir"],[577,"Al-Qiyamah"],[578,"Al-Insan"],[580,"Al-Mursalat"],
  [582,"An-Naba"],[583,"An-Nazi'at"],[585,"'Abasa"],[586,"At-Takwir"],[587,"Al-Infitar"],[587,"Al-Mutaffifin"],
  [589,"Al-Inshiqaq"],[590,"Al-Buruj"],[591,"At-Tariq"],[591,"Al-A'la"],[592,"Al-Ghashiyah"],[593,"Al-Fajr"],
  [594,"Al-Balad"],[595,"Ash-Shams"],[595,"Al-Layl"],[596,"Ad-Duhaa"],[596,"Ash-Sharh"],[597,"At-Tin"],
  [597,"Al-'Alaq"],[598,"Al-Qadr"],[598,"Al-Bayyinah"],[599,"Az-Zalzalah"],[599,"Al-'Adiyat"],[600,"Al-Qari'ah"],
  [600,"At-Takathur"],[601,"Al-'Asr"],[601,"Al-Humazah"],[601,"Al-Fil"],[602,"Quraysh"],[602,"Al-Ma'un"],
  [602,"Al-Kawthar"],[603,"Al-Kafirun"],[603,"An-Nasr"],[603,"Al-Masad"],[604,"Al-Ikhlas"],[604,"Al-Falaq"],[604,"An-Nas"]
];
const TOTAL=604;
const DEFAULTS={
  seenIntro:false,onboarded:false,name:'',avatar:'',email:'',
  mode:'both',method:'tikrar',
  frontier:0,newPerDay:1,revPerDay:1,sabakPages:5,
  chunks:[5,10,15,0],cycle:0,juz:1,period:1,
  tourDay:1,tourNum:1,
  theme:'light',color:'emerald',
  tasbihMode:'ayah',tasbihPhrase:'SubḥānAllāh',
  tasbih:0,tasbihTarget:40,tasbihTotal:0,tasbihTheme:'emerald',
  folders:['Tajweed Lessons','Mutashabihat','Tafsir & Reflections'],
  libFilter:'All',libSubTab:'notes',lastBackup:'',aiKey:''
};

const pad=n=>String(n).padStart(2,'0');
const T=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let D=null, TAB='today', OB_SLIDE=0, T_MENU=false, EDIT_NOTE_ID=null, SHOW_COMPOSER=false;
let mediaRec=null, recChunks=[], isRecording=false, audioDevices=[], selectedMic='', selectedMime='';
const $=id=>document.getElementById(id);
const LS=window.localStorage;
function ld(k,d){try{const v=LS.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{LS.setItem(k,JSON.stringify(v))}catch(e){$('msg').textContent='Storage limit: '+e.message}}

const juzEnd=j=>j===30?TOTAL:JUZ_START[j+1]-1;
function juzOf(p){const pg=Math.max(1,Math.ceil(p));for(let j=30;j>=1;j--)if(pg>=JUZ_START[j])return j;return 1}
function surahIdxOf(p){const pg=Math.max(1,Math.ceil(p));let idx=0;for(let i=0;i<SURAH_AT_PAGE.length;i++){if(pg>=SURAH_AT_PAGE[i][0])idx=i;else break}return idx}
const surahOf=p=>SURAH_AT_PAGE[surahIdxOf(p)][1];
function juzSurahRange(j){
  const s1=surahOf(JUZ_START[j]), s2=surahOf(juzEnd(j));
  return s1===s2?s1:`${s1} – ${s2}`;
}

function fmtFace(u){const p=Math.ceil(u/2), half=(u%2===1)?'h1':'h2'; return `${p} ${half}`}
function rngUnits(u1,u2,useHalf){
  if(!useHalf){const p1=Math.ceil(u1/2), p2=Math.ceil(u2/2); return p1===p2?`Page ${p1}`:`Pages ${p1}–${p2}`}
  if(u1===u2)return `Page ${fmtFace(u1)}`;
  if(u1%2===1 && u2===u1+1)return `Page ${Math.ceil(u1/2)} (h1–h2)`;
  return `Pages ${fmtFace(u1)} → ${fmtFace(u2)}`;
}
const pageFromUnit=u=>Math.max(1,Math.min(TOTAL,Math.ceil(u/2)));

const loadState=()=>Object.assign({},DEFAULTS,ld('hifdh_state',{}));
const saveState=s=>sv('hifdh_state',s);
const loadDays=()=>ld('hifdh_days',{});
const loadNotes=()=>ld('hifdh_notes',[]);
const saveNotes=n=>sv('hifdh_notes',n);

function applyTheme(s){
  document.documentElement.setAttribute('data-theme',s.theme||'light');
  document.documentElement.setAttribute('data-color',s.color||'emerald');
  const colors={emerald:'#1f5f4a',blue:'#2563eb',gold:'#a16207',plum:'#7c3aed'};
  $('metaTheme').setAttribute('content',colors[s.color]||'#1f5f4a');
  $('themeBtn').textContent=s.theme==='dark'?'☀️':'🌙';
}
function toggleTheme(){
  const s=loadState();s.theme=s.theme==='dark'?'light':'dark';
  saveState(s);applyTheme(s);render();
}
function setColor(c){const s=loadState();s.color=c;saveState(s);applyTheme(s);render()}
function setTab(t){
  TAB=t;T_MENU=false;
  ['today','journey','tasbih','recite','library'].forEach(x=>$('nav-'+x).classList.toggle('active',x===t));
  render();
  if(t==='journey'){
    setTimeout(()=>{const el=document.querySelector('.path-node.current');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},120);
  }
}
function jumpToTasbih(targetCount){
  const s=loadState();
  s.tasbihMode='ayah';s.tasbih=0;s.tasbihTarget=targetCount;
  saveState(s);D.state=s;setTab('tasbih');
}

function showCelebration(ico,title,body){
  $('modalRoot').innerHTML=`<div class="modal-bg" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div style="font-size:46px;margin-bottom:8px">${ico}</div>
      <div style="font-size:19px;font-weight:800;color:var(--ac);margin-bottom:6px">${title}</div>
      <div style="font-size:13.5px;line-height:1.5;margin-bottom:16px">${body}</div>
      <button style="width:100%" onclick="closeModal()">Alḥamdulillāh · Continue</button>
    </div>
  </div>`;
}
function closeModal(){$('modalRoot').innerHTML=''}

function addDays(str,k){const p=str.split('-');const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+k);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const anyDone=day=>(day.n&&day.n.done)||(day.sb&&day.sb.done)||day.r.some(t=>t.done);
function allDone(day){
  const t=(day.n?1:0)+(day.sb?1:0)+day.r.length;if(!t)return false;
  return(!day.n||day.n.done)&&(!day.sb||day.sb.done)&&day.r.every(x=>x.done);
}

function makePlan(s){
  const plan={n:null,sb:null,r:[],u:[]};
  const doHifdh=s.mode==='both'||s.mode==='hifdh';
  const doRev=s.mode==='both'||s.mode==='revision';
  const stepPages=Number(s.newPerDay)||1;
  const useHalf=(stepPages===0.5 || (s.frontier%1!==0));
  const curUnits=Math.round((s.frontier||0)*2);
  const stepUnits=Math.max(1,Math.round(stepPages*2));
  const totalUnits=TOTAL*2;

  if(doHifdh && stepPages>0 && curUnits<totalUnits){
    const uA=curUnits+1;
    const uB=Math.min(totalUnits,curUnits+stepUnits);
    const repTarget=stepPages>=3?30:40;
    plan.n={
      uA,uB,a:pageFromUnit(uA),b:uB/2,useHalf,repTarget,done:false,
      subs:{yest:curUnits===0,listen:false,tafsir:false,repeat:false,record:false}
    };
  }

  if(s.method==='tikrar'){
    const connWindowUnits=25*stepUnits;
    if(curUnits>=stepUnits){
      const connEnd=curUnits;
      const connStart=Math.max(1,connEnd-connWindowUnits+1);
      plan.sb={
        uA:connStart,uB:connEnd,a:pageFromUnit(connStart),b:pageFromUnit(connEnd),
        useHalf,label:'Recent Connection (Ar-Rabt)',done:false
      };
      if(doRev){
        const oldEnd=curUnits>=totalUnits ? totalUnits : (connStart-1);
        if(oldEnd>=1){
          const tDay=Math.max(1,Math.min(6,s.tourDay||1));
          const chunk=Math.max(1,Math.ceil(oldEnd/6));
          const revStart=Math.min(oldEnd,(tDay-1)*chunk+1);
          const revEnd=tDay===6?oldEnd:Math.min(oldEnd,tDay*chunk);
          const before={tourDay:tDay,tourNum:s.tourNum||1};
          const after=tDay>=6?{tourDay:1,tourNum:(s.tourNum||1)+1}:{tourDay:tDay+1,tourNum:s.tourNum||1};
          plan.r.push({
            isTikrar:true,tourNum:s.tourNum||1,tourDay:tDay,
            uA:revStart,uB:revEnd,a:pageFromUnit(revStart),b:pageFromUnit(revEnd),
            useHalf,done:false,before,after
          });
        }
      }
    }
    return plan;
  }

  if(s.sabakPages>0 && curUnits>=1 && (doRev || s.mode==='hifdh')){
    const sbUnits=Math.round(s.sabakPages*2);
    const startU=Math.max(1,curUnits-sbUnits+1);
    plan.sb={
      uA:startU,uB:curUnits,a:pageFromUnit(startU),b:pageFromUnit(curUnits),
      useHalf,label:`Recent Revision (Last ${s.sabakPages}p)`,done:false
    };
  }
  if(doRev && s.frontier>=1){
    let pos={c:s.cycle,j:s.juz,p:s.period};
    const chunks=s.method==='classic'?[0]:s.chunks;
    if(pos.c>=chunks.length)pos.c=0;
    for(let i=0;i<s.revPerDay;i++){
      const top=juzOf(s.frontier);
      if(pos.j>top){pos.j=1;pos.c++;if(pos.c>=chunks.length){pos.c=0;pos.p++}}
      const end=Math.min(juzEnd(pos.j),Math.ceil(s.frontier)),st=JUZ_START[pos.j],N=chunks[pos.c];
      const from=N>0?Math.max(st,end-N+1):st;
      const before={c:pos.c,j:pos.j,p:pos.p},after={c:pos.c,j:pos.j+1,p:pos.p};
      plan.r.push({j:pos.j,a:from,b:end,c:pos.c,p:pos.p,n:N,done:false,before,after});
      pos={c:after.c,j:after.j,p:after.p};
    }
  }
  return plan;
}

const api={
  getData(today){
    const s=loadState(),days=loadDays();
    applyTheme(s);
    let day=days[today];
    if(!day||!anyDone(day)){day=makePlan(s);days[today]=day}
    const cutoff=addDays(today,-400);
    Object.keys(days).forEach(k=>{if(k<cutoff)delete days[k]});
    sv('hifdh_days',days);
    const strip=[];
    for(let i=27;i>=0;i--){const d=addDays(today,-i);const o=days[d];strip.push({d,s:o?(allDone(o)?2:(anyDone(o)?1:0)):0})}
    let streak=0;for(let k=strip[27].s===2?27:26;k>=0&&strip[k].s===2;k--)streak++;
    const juz=[];
    for(let j=1;j<=30;j++){const len=juzEnd(j)-JUZ_START[j]+1;juz.push(Math.max(0,Math.min(len,s.frontier-JUZ_START[j]+1))/len)}
    const remaining=Math.max(0,TOTAL-s.frontier);
    const eta=(s.mode!=='revision'&&s.newPerDay>0&&remaining>0)?addDays(today,Math.ceil(remaining/s.newPerDay)-1):null;
    return{state:s,day,stats:{juz,strip,streak,remaining,eta}};
  },
  tick(today,key){
    const s=loadState(),days=loadDays(),day=days[today];
    const task=key==='n'?day.n:(key==='sb'?day.sb:day.r[+key.slice(1)]);
    if(!task)return{error:'Task not found.'};
    if(!task.done){
      if(key==='n'){
        const oldF=s.frontier;
        task.prev=oldF;
        s.frontier=Math.max(s.frontier,task.b);
        const newF=s.frontier;
        if(newF>=TOTAL && oldF<TOTAL){
          showCelebration('👑','Māshā’Allāh! Khatmah Complete!','You have ascended all 30 Ranks to the Radiant Summit—all 604 pages of the Noble Qur’an!');
        }else{
          const newJ=juzOf(newF);
          if(newF===juzEnd(newJ) && oldF<newF){
            showCelebration('🏔️',`Juz ${newJ} Complete!`,`Allāhu Akbar! You completed Juz ${newJ} and ascended to Rank ${Math.min(30,newJ+1)} of 30.`);
          }else if(Math.floor(newF)<TOTAL && surahIdxOf(Math.floor(newF)+1)>surahIdxOf(Math.ceil(oldF||1)) && newF>oldF){
            const finishedSurah=surahOf(Math.floor(newF));
            showCelebration('✨',`Surah ${finishedSurah} Complete!`,`Māshā’Allāh! You finished memorizing Surah ${finishedSurah}. Keep ascending!`);
          }
        }
      }
      else if(key.startsWith('r')){
        if(task.isTikrar){
          s.tourDay=task.after.tourDay;
          s.tourNum=task.after.tourNum;
          if(task.tourDay===6){
            showCelebration('🔄',`Tour / Circuit #${task.tourNum} Complete!`,`Māshā’Allāh! You completed your 6-day revision circuit of all old memorization. Starting Tour #${task.after.tourNum}!`);
          }
        }else{
          const topJuz=juzOf(s.frontier);
          const chunks=s.method==='classic'?[0]:s.chunks;
          s.cycle=task.after.c;s.juz=task.after.j;s.period=task.after.p;
          if(task.j>=topJuz && topJuz>=1){
            if(task.c+1>=chunks.length){
              showCelebration('🌟',`Period ${task.p} Complete!`,`Māshā’Allāh! You finished every cycle of Period ${task.p}. Starting Period ${task.p+1}!`);
            }else{
              showCelebration('🔄',`Revision Cycle ${task.c+1} Complete!`,`Well done! You completed Cycle ${task.c+1} (${chunkName(task.n)}) across all your memorized Juz.`);
            }
          }
        }
      }
      task.done=true;day.u.push(key);
    }else{
      if(day.u[day.u.length-1]!==key)return{error:'Undo the most recent tick first.'};
      if(key==='n')s.frontier=task.prev;
      else if(key.startsWith('r')){
        if(task.isTikrar){s.tourDay=task.before.tourDay;s.tourNum=task.before.tourNum}
        else{s.cycle=task.before.c;s.juz=task.before.j;s.period=task.before.p}
      }
      task.done=false;day.u.pop();
    }
    saveState(s);sv('hifdh_days',days);
    return api.getData(today);
  },
  tickSub(today,subKey){
    const days=loadDays(),day=days[today];
    if(day&&day.n&&day.n.subs){
      day.n.subs[subKey]=!day.n.subs[subKey];
      sv('hifdh_days',days);
    }
    return api.getData(today);
  },
  saveSettings(today,f){
    const s=loadState();
    s.seenIntro=true;s.onboarded=true;
    s.name=(f.name||'').trim();
    s.email=(f.email||'').trim();
    if(f.aiKey!==undefined)s.aiKey=f.aiKey.trim();
    s.mode=f.mode||'both';
    s.method=f.method||'tikrar';
    if(s.method==='ottoman')s.chunks=[5,10,15,0];
    else if(s.method==='classic')s.chunks=[0];
    else if(s.method==='custom'){
      const chunks=String(f.chunks).split(',').map(x=>parseInt(x,10)).filter(x=>!isNaN(x)&&x>=0&&x<=21);
      if(!chunks.length)return{error:'Custom cycle sizes must look like 5,10,15,0 (0 = whole juz).'};
      s.chunks=chunks.slice(0,8);
    }
    const frVal=parseFloat(f.frontier);
    s.frontier=isNaN(frVal)?0:Math.max(0,Math.min(TOTAL,Math.round(frVal*2)/2));
    const npVal=parseFloat(f.newPerDay);
    s.newPerDay=isNaN(npVal)?1:Math.max(0,Math.min(20,Math.round(npVal*2)/2));
    s.revPerDay=Math.max(1,Math.min(5,parseInt(f.revPerDay,10)||1));
    s.sabakPages=Math.max(0,Math.min(30,parseInt(f.sabakPages,10)||0));
    s.cycle=Math.max(0,Math.min(s.chunks.length-1,(parseInt(f.cycle,10)||1)-1));
    s.juz=Math.max(1,Math.min(30,parseInt(f.juz,10)||1));
    s.period=Math.max(1,parseInt(f.period,10)||1);
    if(f.tourDay)s.tourDay=Math.max(1,Math.min(6,parseInt(f.tourDay,10)||1));
    if(f.tourNum)s.tourNum=Math.max(1,parseInt(f.tourNum,10)||1);
    saveState(s);dropIfUnticked(today);
    return api.getData(today);
  },
  addPages(today,n){
    const s=loadState();
    const add=parseFloat(n)||0;
    s.frontier=Math.min(TOTAL,Math.round((s.frontier+Math.max(0,add))*2)/2);
    saveState(s);dropIfUnticked(today);
    return api.getData(today);
  }
};

async function toggleRecord(){
  if(!isRecording){
    try{
      const constraints={audio:selectedMic?{deviceId:{exact:selectedMic}}:true};
      const stream=await navigator.mediaDevices.getUserMedia(constraints);
      await initMics();
      recChunks=[];
      const opts={};
      if(selectedMime && window.MediaRecorder && MediaRecorder.isTypeSupported(selectedMime))opts.mimeType=selectedMime;
      mediaRec=new MediaRecorder(stream,opts);
      mediaRec.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data)};
      mediaRec.onstop=async()=>{
        const mime=mediaRec.mimeType||'audio/webm';
        const blob=new Blob(recChunks,{type:mime});
        stream.getTracks().forEach(t=>t.stop());
        const label=prompt('Label this recitation (e.g., Surah Al-Baqarah 3x Test):','Recitation '+T())||('Recitation '+T());
        const note=prompt('Optional note or Tajweed highlight (e.g., Check Ghunnah at 0:45):','')||'';
        const db=await openDB();
        const tx=db.transaction('clips','readwrite');
        tx.objectStore('clips').put({id:Date.now(),date:T(),label,note,mime,blob});
        tx.oncomplete=()=>render();
      };
      mediaRec.start();isRecording=true;render();
    }catch(e){$('msg').textContent='Microphone permission needed: '+e.message}
  }else{
    mediaRec.stop();isRecording=false;render();
  }
}

  }).join('');

  const n=loadNotes().find(x=>x.id===id);if(!n)return;
  const content=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${n.title}</title>
    <style>body{font-family:system-ui,sans-serif;padding:28px;line-height:1.6}table{width:100%;border-collapse:collapse}td,th{border:1px solid #999;padding:6px}</style>
    </head><body><h1>${n.title}</h1><p style="color:#666">${n.cat} · ${n.date}</p>${n.link?`<p><a href="${n.link}">${n.link}</a></p>`:''}<div>${n.html||n.body||''}</div></body></html>`;
  if(type==='pdf'){
    const w=window.open('','_blank');
    if(w){w.document.write(content);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
  }else if(type==='doc'){
    const blob=new Blob(['\ufeff',content],{type:'application/msword'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${n.title.replace(/\s+/g,'_')}.doc`;a.click();
  }else if(type==='share'){
    const tmp=document.createElement('div');tmp.innerHTML=n.html||n.body||'';
    const txt=`📖 ${n.title} (${n.cat})\n\n${tmp.innerText}\n${n.link?'\n🔗 '+n.link:''}`;
    if(navigator.share)navigator.share({title:n.title,text:txt}).catch(()=>{});
    else{navigator.clipboard.writeText(txt);$('msg').textContent='Copied to clipboard!'}
  }
}

function ytEmbedUrl(url){
  if(!url)return null;
  const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/);
  return m?`https://www.youtube.com/embed/${m[1]}`:null;
}

function sendEmailSummary(){
  const s=D.state,st=D.stats;
  const to=encodeURIComponent(s.email||'');

function exportData(){
  const s=loadState();s.lastBackup=T();saveState(s);
  const blob=new Blob([JSON.stringify({app:'hifdh',v:7,state:s,days:loadDays(),notes:loadNotes()})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-companion-backup-'+T()+'.json';
  document.body.appendChild(a);a.click();a.remove();render();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);
    if(o.app!=='hifdh'||!o.state||!o.days)throw new Error('Invalid backup file.');
    if(!confirm('Replace your current data with this backup?'))return;
    saveState(Object.assign({},DEFAULTS,o.state));sv('hifdh_days',o.days);
    if(o.notes)saveNotes(o.notes);
    D=null;render();
  }catch(e){$('msg').textContent=e.message}};
  r.readAsText(f);inp.value='';
}
function resetAll(){LS.removeItem('hifdh_state');LS.removeItem('hifdh_days');LS.removeItem('hifdh_notes');D=null;render()}
function replayIntro(){const s=loadState();s.seenIntro=false;OB_SLIDE=0;saveState(s);D.state=s;render()}

          <div class="row"><b>${c.label}</b><span class="mu">${c.date}</span></div>
          ${c.note?`<div style="font-size:12.5px;background:var(--ac2);color:var(--ac);padding:6px 9px;border-radius:8px;margin-top:6px">📌 ${c.note}</div>`:''}
          <audio controls src="${url}" style="width:100%;height:36px;margin-top:8px"></audio>
          <div class="row" style="margin-top:8px;justify-content:flex-end;gap:6px">
            <button class="g sm" onclick="editClipNote(${c.id},'${(c.note||'').replace(/'/g,"\\'")}')">✏️ Note</button>
            <button class="g sm" onclick="shareClip(${c.id})">📤 Share</button>
            <button class="g sm" onclick="deleteClip(${c.id})">🗑️</button>
          </div>
        </div>`;
      }).join(''):'<div class="mu">No recordings yet. Tap record above or upload an existing recitation.</div>'}
    </div>`;
  }

  /* TAB 5: LIBRARY */
  else if(TAB==='library'){
    const notes=loadNotes();
    const vault=await loadVault();
    const allFolders=['All',...s.folders];
    const filteredNotes=s.libFilter==='All'?notes:notes.filter(n=>n.cat===s.libFilter);
    const filteredVault=s.libFilter==='All'?vault:vault.filter(v=>v.folder===s.libFilter);
    const totalVaultMB=(vault.reduce((a,b)=>a+(b.size||0),0)/(1024*1024)).toFixed(1);

    let h=`<div class="card">
      <div class="row">
        <h2>📂 Study Library & Lessons</h2>
        <div class="row" style="gap:6px">
          <button class="${s.libSubTab==='notes'?'':'g'} sm" onclick="setLibSubTab('notes')">📝 Lessons (${notes.length})</button>
          <button class="${s.libSubTab==='vault'?'':'g'} sm" onclick="setLibSubTab('vault')">🎞️ Vault (${vault.length})</button>
        </div>
      </div>
      <div class="cyc" style="margin-top:8px">
        ${allFolders.map(c=>`<span class="cy ${s.libFilter===c?'on':''}" onclick="setLibFilter('${c}')">${c}</span>`).join('')}
        <span class="cy" onclick="addFolder()">+ Folder</span>
      </div>
    </div>`;

    if(s.libSubTab==='notes'){
      h+=`<div class="card">
        <div class="row">
          <b>${EDIT_NOTE_ID?'✏️ Editing Lesson / Note':'✨ Create Lesson or Rich Note'}</b>
          <button class="sm" onclick="SHOW_COMPOSER=!SHOW_COMPOSER;EDIT_NOTE_ID=null;render()">${SHOW_COMPOSER?'Close':'+ New Note'}</button>
        </div>
        ${SHOW_COMPOSER?`<div style="margin-top:12px">
          <div class="two">
            <div><label class="f">Lesson / Note Title</label><input type="text" id="ntTitle" placeholder="e.g., Noon Sakinah"></div>
            <div><label class="f">Folder</label>
              <select id="ntCat">${s.folders.map(f=>`<option value="${f}">${f}</option>`).join('')}</select>
            </div>
          </div>
          <label class="f">Optional Video / Photo / Reference Link</label>
          <input type="text" id="ntLink" placeholder="https://youtube.com/...">

          <label class="f">Rich Text & Table Editor</label>
          <div class="rt-bar">
            <select onchange="execRT('fontName',this.value)">
              <option value="system-ui">Sans</option>
              <option value="Georgia,serif">Serif</option>
              <option value="'Amiri','Traditional Arabic',serif">Arabic / Quranic</option>
            </select>
            <select onchange="execRT('fontSize',this.value)">
              <option value="2">Small</option>
              <option value="3" selected>Normal</option>
              <option value="4">Large</option>
              <option value="5">Heading</option>
            </select>
            <button class="g sm" onclick="execRT('bold')"><b>B</b></button>
            <button class="g sm" onclick="execRT('italic')"><i>I</i></button>
            <button class="g sm" onclick="execRT('underline')"><u>U</u></button>
            <button class="g sm" onclick="execRT('insertUnorderedList')">• List</button>
            <button class="g sm" onclick="insertRTTable()">⊞ Table</button>
            <button class="g sm" onclick="$('rtImgInp').click()">🖼️ Photo</button>
            <button class="sm" onclick="polishNoteAI()">✨ Polish</button>
          </div>
          <input type="file" id="rtImgInp" accept="image/*" style="display:none" onchange="attachInlinePhoto(this)">
          <div id="rtEditor" class="rt-area" contenteditable="true" placeholder="Write your lesson or paste verses..."></div>
          <button style="width:100%;margin-top:10px" onclick="saveRichNote()">💾 Save Lesson / Note</button>
        </div>`:''}
      </div>`;

      h+=filteredNotes.length?filteredNotes.map(n=>{
        const yt=ytEmbedUrl(n.link);
        const isImg=n.link && /\.(jpeg|jpg|gif|png|webp)(\?.*)?$/i.test(n.link);
        return `<div class="card">
          <div class="row"><span class="pill">${n.cat||'Lesson'}</span><span class="mu">${n.date}</span></div>
          <h2 style="margin:6px 0">${n.title}</h2>
          ${yt?`<iframe src="${yt}" style="width:100%;height:200px;border:0;border-radius:12px;margin:6px 0" allowfullscreen></iframe>`:''}
          ${isImg?`<img src="${n.link}" style="max-width:100%;border-radius:10px;margin:6px 0">`:''}
          ${n.link&&!yt&&!isImg?`<div style="margin:4px 0"><a href="${n.link}" target="_blank" style="color:var(--ac);font-size:12.5px;font-weight:700">🔗 Open Resource Link ↗</a></div>`:''}
          <div style="font-size:13.5px;line-height:1.55;margin-top:8px;overflow-x:auto">${n.html||n.body||''}</div>
          <div class="row" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);flex-wrap:wrap;gap:6px">
            <div class="row" style="gap:5px">
              <button class="g sm" onclick="editNote(${n.id})">✏️ Edit</button>
              <button class="g sm" onclick="delNote(${n.id})">🗑️</button>
            </div>
            <div class="row" style="gap:5px">
              <button class="g sm" onclick="exportNoteDoc(${n.id},'pdf')">📄 PDF</button>
              <button class="g sm" onclick="exportNoteDoc(${n.id},'doc')">📝 Word</button>
              <button class="g sm" onclick="exportNoteDoc(${n.id},'share')">📤 Share/Drive</button>
            </div>
          </div>
        </div>`;
      }).join(''):`<div class="card mu">No lessons or notes in this folder yet. Tap <b>+ New Note</b> above to create one!</div>`;
    }else{
      h+=`<div class="card">
        <div class="row">
          <div><b>🎞️ Offline Media Vault</b><div class="mu">Store photos, videos & audio offline (${totalVaultMB} MB used)</div></div>
          <button class="sm" onclick="$('vaultInp').click()">+ Upload File</button>
        </div>
        <div style="margin-top:8px">
          <label class="f">Save Uploaded File Into Folder:</label>
          <select id="vaultFolderSel">${s.folders.map(f=>`<option value="${f}">${f}</option>`).join('')}</select>
        </div>
        <input type="file" id="vaultInp" accept="image/*,video/*,audio/*" style="display:none" onchange="uploadVaultMedia(this)">
      </div>`;

      h+=filteredVault.length?`<div class="media-grid">`+filteredVault.map(v=>{
        const url=URL.createObjectURL(v.blob);
        const tp=v.type||'';
        let mediaEl='';
        if(tp.startsWith('image/'))mediaEl=`<img src="${url}" onclick="window.open('${url}','_blank')">`;
        else if(tp.startsWith('video/'))mediaEl=`<video controls src="${url}"></video>`;
        else mediaEl=`<audio controls src="${url}" style="width:100%"></audio>`;
        return `<div class="media-box">
          <span class="pill">${v.folder||'Media'}</span>
          <div style="font-weight:700;font-size:13px;margin:4px 0">${v.title}</div>
          ${mediaEl}
          <div class="row" style="margin-top:6px">
            <span class="mu">${((v.size||0)/(1024*1024)).toFixed(1)} MB</span>
            <button class="g sm" onclick="deleteVaultItem(${v.id})">🗑️</button>
          </div>
        </div>`;
      }).join('')+`</div>`:`<div class="card mu">No offline media files in this folder yet. Tap <b>+ Upload File</b> to save files for offline study.</div>`;
    }
    $('app').innerHTML=h;
  }

  /* PROFILE & SETTINGS (Clean Visual Controls & Advanced Settings Drawer) */
  else if(TAB==='settings'){
    const cols=[['emerald','#1f5f4a'],['blue','#2563eb'],['gold','#a16207'],['plum','#7c3aed']];
    const modes=[['both','🌱 Both Hifdh & Revision'],['hifdh','📖 Hifdh Only'],['revision','🔄 Revision Only']];
    const methods=[['tikrar','🕌 Madinah Tikrar Program'],['ottoman','🌙 Ottoman Cycles'],['classic','📖 Classic Juz'],['custom','⚙️ Custom Pace']];
    const paces=[0.5,1,2,3];

    $('app').innerHTML=`
    <div class="tg-banner">
      <div style="font-size:15px;font-weight:800">📢 My Companion Community & Updates</div>
      <div style="font-size:12.5px;opacity:.92;margin-top:3px">Follow our official Telegram channel for updates, tips, or support.</div>
      <div>
        <a href="https://t.me/MyCompanionApp" target="_blank">🚀 Updates Channel</a>
        <a href="https://t.me/MyCompanionApp" target="_blank">💡 Request Feature</a>
      </div>
    </div>

    <div class="card">
      <details>
        <summary>📚 Study Methods & Golden Rules Explained</summary>
        <div style="font-size:13px;line-height:1.55;margin-top:10px">
          <p><b>1. 🕌 The Tikrar (Madinah) Method (0.5, 1, 2, or 3 Pages/Day):</b><br>
          Designed for rock-solid mastery. Every day consists of:<br>
          • <b>Yesterday's Repeat (5x):</b> Recite yesterday's portion 5 times from memory.<br>
          • <b>Listening (3x):</b> Listen to a master reciter 3 times while looking at the Mushaf.<br>
          • <b>Tafsir (1x):</b> Read the meaning of the verses.<br>
          • <b>Repetition (40x or 30x):</b> Repeat the new portion 40 times (30x on 3 pages).<br>
          • <b>Recording (3x):</b> Record yourself reciting 3 times from memory.<br>
          • <b>Connectivity (Ar-Rabt):</b> Recite all mastered pages from the past ~25–30 days once from memory.<br>
          • <b>Review (6-Day Circuit):</b> All older pages that exit Connectivity are divided into 6 days so you complete a full circuit every 6 days!</p>
          <p><b>2. 🌙 Ottoman & Classic Methods:</b><br>
          Progressive rounds (5p → 10p → 15p → Full Juz) or full Juz daily rotations.</p>
        </div>
      </details>
    </div>

    <div class="card"><h2>🎯 Your Goal & Study Method</h2>
      <label class="f">Goal</label>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${modes.map(m=>`<div class="choice-card ${s.mode===m[0]?'on':''}" onclick="setStMode('${m[0]}')"><b>${m[1]}</b></div>`).join('')}
      </div>

      <label class="f" style="margin-top:12px">Method</label>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${methods.map(mt=>`<div class="choice-card ${s.method===mt[0]?'on':''}" onclick="setStMethod('${mt[0]}')"><b>${mt[1]}</b></div>`).join('')}
      </div>

      <label class="f" style="margin-top:12px">Daily New Pace (Pages)</label>
      <div class="cyc">
        ${paces.map(p=>`<span class="cy ${(s.newPerDay===p)?'on':''}" onclick="setStPace(${p})">${p===0.5?'½ Page':p+' Page'+(p>1?'s':'')}</span>`).join('')}
      </div>

      <label class="f" style="margin-top:12px">Pages Memorized (0–604)</label>
      <input type="number" step="0.5" id="stFr" value="${s.frontier}">

      <details style="margin-top:14px">
        <summary class="mu" style="color:var(--ac)">⚙️ Advanced Fine-Tuning (Optional)</summary>
        <div style="margin-top:10px">
          <div class="two">
            <div><label class="f">Tikrar Circuit / Tour #</label><input type="number" id="stTourNum" value="${s.tourNum||1}"></div>
            <div><label class="f">Day in 6-Day Circuit (1–6)</label><input type="number" id="stTourDay" value="${s.tourDay||1}"></div>
            <div><label class="f">Sabak Dhor Pages</label><input type="number" id="stSb" value="${s.sabakPages}"></div>
            <div><label class="f">Period #</label><input type="number" id="stPe" value="${s.period}"></div>
          </div>
        </div>
      </details>

      <button style="width:100%;margin-top:14px" onclick="saveSettingsSimple()">Save Plan Settings</button>
    </div>

    <div class="card"><h2>👤 Profile & Appearance</h2>
      <div class="row" style="justify-content:flex-start;gap:14px;margin-bottom:10px">
        <div class="avatar avatar-lg">${s.avatar?`<img src="${s.avatar}" alt="">`:initials(s.name)}</div>
        <div>
          <button class="sm" onclick="$('avInp').click()">Upload Photo</button>
          ${s.avatar?`<button class="g sm" style="margin-left:6px" onclick="removeAvatar()">Remove</button>`:''}
          <input type="file" id="avInp" accept="image/*" style="display:none" onchange="uploadAvatar(this)">
        </div>
      </div>
      <div class="two">
        <div><label class="f">Your Name</label><input type="text" id="stName" value="${s.name}"></div>
        <div><label class="f">Your Email</label><input type="email" id="stEmail" value="${s.email}"></div>
      </div>
      <label class="f">Optional Gemini API Key (<a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--ac)">Get Free Key ↗</a>)</label>
      <input type="text" id="stAiKey" placeholder="AIza..." value="${s.aiKey||''}">
      <label class="f">App Color Palette</label>
      <div class="swatches">${cols.map(c=>`<div class="swatch ${s.color===c[0]?'on':''}" style="background:${c[1]}" onclick="setColor('${c[0]}')"></div>`).join('')}</div>
      <div class="two" style="margin-top:12px">
        <button class="g sm" onclick="enableReminder()">🔔 Daily Alert</button>
        <button class="g sm" onclick="sendEmailSummary()">✉️ Email Summary</button>
      </div>
    </div>

    <div class="card"><h2>⚡ Quick Actions & Backup</h2>
      <label class="f">Add Extra Memorized Pages</label>
      <div class="row"><input type="number" step="0.5" id="ad" value="1" style="width:90px"><button class="sm" onclick="call('addPages',$('ad').value)">Add Pages</button></div>
      <label class="f" style="margin-top:14px">Backup Data (Last backup: ${s.lastBackup||'Never'})</label>
      <div class="two"><button onclick="exportData()">Export Backup</button><button class="g" onclick="$('imp').click()">Import Backup</button></div>
      <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">
      <button class="d" style="width:100%;margin-top:16px" onclick="if(confirm('Delete ALL your data?')){resetAll()}">Reset Everything</button>
    </div>`;
  }
}

/* Visual Onboarding & Settings Helpers */
function setObMode(m){const s=loadState();s.mode=m;saveState(s);D.state=s;render()}
function setObMethod(mt){const s=loadState();s.method=mt;saveState(s);D.state=s;render()}
function setObPace(p){const s=loadState();s.newPerDay=p;saveState(s);D.state=s;render()}

function setStMode(m){const s=loadState();s.mode=m;saveState(s);D.state=s;render()}
function setStMethod(mt){const s=loadState();s.method=mt;saveState(s);D.state=s;render()}
function setStPace(p){const s=loadState();s.newPerDay=p;saveState(s);D.state=s;render()}

function finishOnboarding(){
  call('saveSettings',{
    name:$('obName').value,email:'',
    frontier:$('obFr').value
  });
}
function saveSettingsSimple(){
  call('saveSettings',{
    name:$('stName').value,email:$('stEmail').value,aiKey:$('stAiKey').value,
    frontier:$('stFr').value,
    tourNum:$('stTourNum')?$('stTourNum').value:1,
    tourDay:$('stTourDay')?$('stTourDay').value:1,
    sabakPages:$('stSb')?$('stSb').value:5,
    period:$('stPe')?$('stPe').value:1
  });
}

document.addEventListener('visibilitychange',()=>{if(!document.hidden){D=null;render()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
